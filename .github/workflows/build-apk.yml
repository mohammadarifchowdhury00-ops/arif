name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install Android 36.1
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36.1" "platforms;android-36" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare keystore and env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK with clear filename
        run: cp app/build/outputs/apk/debug/app-debug.apk THE-ARIF-JOURNAL.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE-ARIF-JOURNAL-APK
          path: THE-ARIF-JOURNAL.apk

      - name: Create GitHub Release with direct APK download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: THE ARIF JOURNAL (Android APK)
          body: নিচে থাকা **THE-ARIF-JOURNAL.apk** ফাইলে ক্লিক করে সরাসরি আপনার অ্যান্ড্রয়েড ফোনে ডাউনলোড ও ইনস্টল করুন।
          files: THE-ARIF-JOURNAL.apk
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
